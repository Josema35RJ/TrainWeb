<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAHÍA CERO | THE IMMERSIVE TRAM</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700;800&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    
    <style>
        /* --- 0. CORE & RESETS --- */
        :root {
            --tram-turq: #00f0d4;
            --led-green: #00ff9d;
            --led-red: #ff3838;
            --seat-color: #334155;
            --seat-fabric: #475569;
        }
        body { margin: 0; background: #000; height: 100vh; overflow: hidden; font-family: 'Inter', sans-serif; user-select: none; color: #fff; }
        
        /* --- 1. FONDO & EFECTOS --- */
        #noise-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 900;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.15; mix-blend-mode: overlay;
        }
        #vignette {
            position: fixed; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 800;
            background: radial-gradient(circle, transparent 40%, #000 120%);
        }

        #world-stage { position: absolute; top:0; left:0; width:100%; height:100%; z-index:0; overflow: hidden; }
        #scenery-layer {
            position: absolute; top:-10%; left:-10%; width:120%; height:120%;
            background: url('https://images.unsplash.com/photo-1494587416117-f10426b770cb?q=80&w=2670') center/cover;
            filter: brightness(0.2) blur(2px); transition: filter 2s;
        }
        .moving #scenery-layer {
            animation: speedShake 0.2s infinite, passingCity 0.5s linear infinite; 
            filter: blur(10px) brightness(0.4);
        }
        @keyframes speedShake { 0% { transform: translate(0,0); } 25% { transform: translate(2px, 2px); } 75% { transform: translate(-2px, -2px); } }
        
        #tunnel-lights {
            position: absolute; top:0; left:0; width:100%; height:100%; z-index: 2;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 200, 100, 0) 50%, transparent 100%);
            mix-blend-mode: overlay; pointer-events: none;
        }
        .moving #tunnel-lights { animation: tunnelFlash 0.8s infinite; }
        @keyframes tunnelFlash { 
            0% { background: linear-gradient(90deg, transparent 100%, transparent 100%); opacity: 0; }
            5% { background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 200, 0.4) 10%, transparent 40%); opacity: 1; }
            100% { background: linear-gradient(90deg, transparent 80%, rgba(255, 255, 200, 0.4) 100%, transparent 100%); opacity: 0; }
        }

        /* --- TRAM CONTAINER --- */
        #tram-container {
            position: absolute; width:100%; height:100%; z-index: 10;
            display: flex; flex-direction: column;
            animation: idleRattle 4s infinite ease-in-out;
        }
        .moving #tram-container { animation: violentShake 0.1s infinite; }
        @keyframes idleRattle { 0% { transform: translateY(0); } 50% { transform: translateY(1px); } 100% { transform: translateY(0); } }
        @keyframes violentShake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -2px); } 100% { transform: translate(0px, 1px); } }

        /* TECHO */
        .ceiling {
            height: 12%; background: linear-gradient(to bottom, #2b2b2b, #1a1a1a);
            border-bottom: 5px solid #000; display: flex; align-items: center; justify-content: space-between;
            padding: 0 5%; position: relative; z-index: 50; box-shadow: 0 10px 50px rgba(0,0,0,0.8);
        }
        .pis-screen {
            background: #000; border: 2px solid #333; width: 40%; height: 50%;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            box-shadow: inset 0 0 10px #000; position: relative;
        }
        .pis-screen::after { /* Scanlines */
            content: ''; position: absolute; top:0; left:0; width:100%; height:100%;
            background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.5) 3px);
            pointer-events: none;
        }
        .led-text {
            font-family: 'Share Tech Mono'; color: #ffaa00; font-size: 1.5rem;
            text-shadow: 0 0 8px #ffaa00; white-space: nowrap;
        }

        /* CUERPO */
        .body-section { flex: 1; display: flex; position: relative; }

        /* --- PUERTAS --- */
        .doors-area {
            width: 55%; height: 100%; position: relative;
            background: repeating-linear-gradient(90deg, #333 0, #333 1px, transparent 1px, transparent 4px), linear-gradient(to right, #2a2a2a, #444);
            border-right: 15px solid #111;
        }
        .door-frame {
            position: absolute; bottom: 0; width: 100%; height: 90%;
            border-top: 20px solid #111; overflow: hidden;
        }
        .door-panel {
            position: absolute; top:0; width: 50%; height: 100%;
            background: linear-gradient(90deg, #b0bec5 0%, #78909c 20%, #eceff1 45%, #b0bec5 80%);
            border: 1px solid #546e7a; box-shadow: inset 2px 0 10px rgba(0,0,0,0.5);
            transition: transform 2.5s cubic-bezier(0.2, 0, 0.2, 1); z-index: 5;
            display: flex; align-items: center; justify-content: center;
        }
        .door-left { left: 0; border-right: 4px solid #333; }
        .door-right { right: 0; border-left: 4px solid #333; }
        .doors-open .door-left { transform: translateX(-96%); }
        .doors-open .door-right { transform: translateX(96%); }
        .door-window {
            width: 70%; height: 65%; background: rgba(10, 20, 30, 0.6);
            border: 12px solid #222; position: relative; overflow: hidden;
        }
        .rain-glass {
            position: absolute; width:100%; height:100%; opacity: 0.6;
            background: url('https://www.transparenttextures.com/patterns/rain.png'); mix-blend-mode: overlay;
        }

        /* BOTÓN DE PUERTA - AJUSTADO */
        .btn-mount {
            position: absolute; top: 60%; 
            /* En la puerta derecha, pero cerca del borde izquierdo (centro) */
            left: -40px; 
            transform: translateY(-50%); z-index: 20;
        }
        #door-button {
            width: 80px; height: 80px; border-radius: 50%; background: #222;
            border: 4px solid #444; box-shadow: 0 10px 20px rgba(0,0,0,0.8);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: transform 0.1s; position: relative;
        }
        #door-button:active { transform: translateY(-50%) scale(0.95); }
        .ring-light {
            width: 60px; height: 60px; border-radius: 50%; border: 4px solid #333;
            box-shadow: inset 0 0 20px #000; transition: 0.3s;
        }
        .status-ready .ring-light { border-color: var(--led-green); box-shadow: 0 0 30px var(--led-green); animation: pulseGreen 1.5s infinite; }
        .status-locked .ring-light { border-color: var(--led-red); opacity: 0.5; }
        @keyframes pulseGreen { 0% { opacity: 0.5; } 50% { opacity: 1; box-shadow: 0 0 50px var(--led-green); } 100% { opacity: 0.5; } }

        /* --- ZONA PASAJEROS --- */
        .passenger-area {
            width: 45%; height: 100%; position: relative;
            background: linear-gradient(to right, #222, #333);
            display: flex; flex-direction: column; justify-content: flex-end;
            overflow: hidden; /* Importante para que los pasajeros no salgan del container al caminar */
        }
        .side-window-frame {
            position: absolute; top: 10%; left: 10%; width: 80%; height: 50%;
            background: #000; border: 8px solid #111; overflow: hidden;
            box-shadow: inset 0 0 50px #000; border-radius: 4px; z-index: 1;
        }
        .window-reflection {
            position: absolute; width:100%; height:100%;
            background: linear-gradient(110deg, transparent 40%, rgba(255,255,255,0.05) 45%, transparent 50%);
            z-index: 10;
        }
        .moving .window-reflection { animation: reflectionPass 2s infinite linear; }
        @keyframes reflectionPass { from { background-position: -200px 0; } to { background-position: 200px 0; } }

        /* --- ASIENTOS REALISTAS --- */
        .seats-container {
            width: 100%; height: 35%; 
            position: relative; z-index: 5;
            display: flex; justify-content: space-evenly; align-items: flex-end;
            padding-bottom: 20px;
            perspective: 600px;
        }
        .seat {
            width: 90px; height: 140px;
            position: relative; transform-style: preserve-3d;
        }
        /* Respaldo */
        .seat-back {
            position: absolute; bottom: 50px; left: 0; width: 100%; height: 100%;
            background: var(--seat-color);
            border-radius: 15px 15px 5px 5px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        /* Textura Tela */
        .seat-fabric {
            width: 100%; height: 100%;
            background: repeating-radial-gradient(circle, var(--seat-fabric) 0, var(--seat-fabric) 1px, transparent 2px, transparent 4px);
            background-size: 8px 8px; opacity: 0.5;
        }
        /* Cabecero */
        .seat-headrest {
            position: absolute; top: 0; left: 10%; width: 80%; height: 30px;
            background: #1e293b; border-radius: 5px 5px 15px 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        /* Asiento Base */
        .seat-cushion {
            position: absolute; bottom: 0; left: -5%; width: 110%; height: 60px;
            background: var(--seat-color);
            border-radius: 10px;
            background-image: linear-gradient(to bottom, rgba(255,255,255,0.05), rgba(0,0,0,0.2));
            transform: rotateX(20deg); transform-origin: bottom;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
        }

        /* --- PASAJEROS (SOMBRAS) --- */
        .npc-walker {
            position: absolute; 
            width: 70px; height: 180px;
            background: #000;
            border-radius: 35px 35px 0 0;
            z-index: 4; /* Entre ventana y asientos */
            filter: blur(2px);
            opacity: 0;
            transition: transform 3s ease-in-out, opacity 1s, height 1s;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        /* Partes del cuerpo simples para la silueta */
        .npc-walker::before { /* Cabeza */
            content: ''; position: absolute; top: -20px; left: 15px; width: 40px; height: 40px;
            background: #000; border-radius: 50%;
        }
        .npc-seated {
            height: 110px !important;
            transform: translateY(20px) scale(0.95);
        }

        /* Palo Validador */
.pole-group {
    position: absolute; 
    left: 1%; /* Antes estaba en -20px, ahora se desplaza a la derecha */
    top: 0; 
    height: 100%; 
    width: 60px;
    display: flex; 
    justify-content: center; 
    z-index: 50;
    pointer-events: none;
}
        .pole {
            width: 15px; height: 100%; background: linear-gradient(90deg, #666, #ddd, #666);
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }
        #validator {
            position: absolute; top: 45%; width: 60px; height: 100px;
            background: #f59e0b; border: 4px solid #78350f; border-radius: 8px;
            cursor: pointer; box-shadow: 0 5px 20px rgba(0,0,0,0.6); pointer-events: auto;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .val-screen { width: 40px; height: 25px; background: #2a1a05; margin-bottom: 8px; border: 1px solid #666; display:flex; justify-content:center; align-items:center; }
        .val-status { width: 8px; height: 8px; border-radius: 50%; background: #333; transition: 0.2s; }

        /* SUELO */
        .floor {
            height: 15%; background: url('https://www.transparenttextures.com/patterns/concrete-wall.png'), #1e293b;
            box-shadow: inset 0 20px 50px rgba(0,0,0,0.8);
            border-top: 5px solid #333; z-index: 20; position: relative;
        }

        /* UI HOLOGRAMA */
        #holo-interface {
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%) scale(0.9);
            width: 400px; height: 300px; z-index: 100; pointer-events: none; opacity: 0;
            background: rgba(0, 20, 25, 0.9); border: 1px solid var(--tram-turq);
            backdrop-filter: blur(10px); padding: 30px; text-align: center;
            transition: opacity 0.5s, transform 0.5s;
            box-shadow: 0 0 100px rgba(0, 240, 212, 0.2);
            clip-path: polygon(10% 0, 100% 0, 100% 90%, 90% 100%, 0 100%, 0 10%);
        }
        .holo-active { opacity: 1 !important; transform: translate(-50%, -50%) scale(1) !important; pointer-events: auto !important; }
        .holo-btn {
            background: transparent; border: 2px solid var(--tram-turq); color: var(--tram-turq);
            padding: 10px 30px; font-family: 'Rajdhani'; font-weight: 700; font-size: 1.2rem;
            cursor: pointer; transition: 0.3s; text-transform: uppercase;
        }
        .holo-btn:hover { background: var(--tram-turq); color: #000; box-shadow: 0 0 30px var(--tram-turq); }

        /* NAV */
        #control-tablet {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #0f172a; padding: 10px 20px; border-radius: 40px; border: 2px solid #334155;
            display: flex; gap: 10px; box-shadow: 0 20px 60px rgba(0,0,0,0.9); z-index: 200;
        }
        .nav-pill {
            background: transparent; border: none; color: #64748b; font-family: 'Rajdhani'; font-weight: 700;
            padding: 10px 20px; cursor: pointer; transition: 0.3s; border-radius: 20px;
        }
        .nav-pill.active { background: #334155; color: #fff; box-shadow: 0 0 15px rgba(255,255,255,0.1); }
        
        #start-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%; background: #000; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 1s;
        }
        .start-btn {
            background: transparent; color: var(--tram-turq); border: 2px solid var(--tram-turq);
            padding: 20px 50px; font-size: 1.5rem; font-family: 'Rajdhani'; letter-spacing: 5px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <h1 style="font-family: 'Rajdhani'; color: #fff; margin-bottom: 0;">BAHÍA CERO</h1>
        <button class="start-btn" onclick="initExperience()">INICIAR SISTEMA</button>
    </div>

    <div id="noise-overlay"></div>
    <div id="vignette"></div>

    <div id="world-stage">
        <div id="scenery-layer"></div>
        <div id="tunnel-lights"></div>
    </div>

    <div id="tram-container">
        
        <div class="ceiling">
            <div class="light-strip"></div>
            <div class="pis-screen">
                <marquee class="led-text" scrollamount="12" id="led-msg">SISTEMA EN ESPERA...</marquee>
            </div>
            <div class="light-strip"></div>
        </div>

        <div class="body-section">
            
            <div class="doors-area">
                <div id="holo-interface">
                    <h2 id="holo-title" style="font-family: 'Rajdhani'; color: #00f0d4; margin:0;">DESTINO</h2>
                    <p id="holo-desc" style="font-family: 'Share Tech Mono'; color: #aaa; margin: 20px 0;">Info...</p>
                    <button class="holo-btn">ACCEDER</button>
                </div>

                <div class="door-frame" id="door-mechanism">
                    <div class="door-panel door-left">
                        <div class="door-window"><div class="rain-glass"></div></div>
                    </div>
                    <div class="door-panel door-right">
                        <div class="door-window"><div class="rain-glass"></div></div>
                        <div class="btn-mount">
                            <div id="door-button" class="status-locked" onclick="interactionDoors()">
                                <div class="ring-light"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="passenger-area">
                <div class="side-window-frame">
                    <div class="window-reflection"></div>
                </div>
                
                <div class="pole-group">
                    <div class="pole"></div>
                    <div id="validator" onclick="interactionValidate()">
                        <div class="val-screen"><span style="font-size:10px; color:#f00;">NFC</span></div>
                        <div class="val-status"></div>
                    </div>
                </div>

                <div class="seats-container" id="seats-row">
                    </div>
            </div>

        </div>
        <div class="floor"></div>
    </div>

    <div id="control-tablet">
        <button class="nav-pill active" onclick="travelTo(0)">INICIO</button>
        <button class="nav-pill" onclick="travelTo(1)">NOTICIAS</button>
        <button class="nav-pill" onclick="travelTo(2)">HISTORIA</button>
        <button class="nav-pill" onclick="travelTo(3)">TIENDA</button>
    </div>

    <script>
        /* --- CONFIGURACIÓN --- */
        const destinations = [
            { id: 0, name: "BAHÍA CERO", led: "TERMINAL PRINCIPAL", desc: "Origen de la realidad." },
            { id: 1, name: "NOTICIAS", led: "DISTRITO INFORMATIVO", desc: "Actualizaciones del sector 7." },
            { id: 2, name: "HISTORIA", led: "ARCHIVOS ANTIGUOS", desc: "Registros corruptos." },
            { id: 3, name: "TIENDA", led: "ZONA COMERCIAL", desc: "Mejoras disponibles." }
        ];

        let state = { currentIdx: 0, isMoving: false, doorsOpen: false, canOpen: false };
        let audioCtx, oscDrone, gainDrone;

        // Renderizar Asientos
        const seatsContainer = document.getElementById('seats-row');
        // Definimos 3 asientos
        const seatConfig = [0, 1, 2]; 
        let occupiedSeats = [false, false, false]; // Estado de ocupación

        seatConfig.forEach(i => {
            const seat = document.createElement('div');
            seat.className = 'seat';
            seat.id = `seat-${i}`;
            seat.innerHTML = `
                <div class="seat-back"><div class="seat-headrest"></div><div class="seat-fabric"></div></div>
                <div class="seat-cushion"><div class="seat-fabric"></div></div>
            `;
            seatsContainer.appendChild(seat);
        });

        /* --- AUDIO --- */
        function initExperience() {
            document.getElementById('start-overlay').style.opacity = '0';
            setTimeout(() => document.getElementById('start-overlay').remove(), 1000);
            
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            oscDrone = audioCtx.createOscillator();
            gainDrone = audioCtx.createGain();
            oscDrone.type = 'sawtooth';
            oscDrone.frequency.value = 50;
            gainDrone.gain.value = 0.05;
            
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass'; filter.frequency.value = 120;

            oscDrone.connect(filter); filter.connect(gainDrone);
            gainDrone.connect(audioCtx.destination);
            oscDrone.start();
            arrive(0);
        }

        function playSound(type) {
            if(!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if (type === 'door') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.5);
                gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(now); osc.stop(now + 0.6);
            } else if (type === 'chime') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 1);
                osc.start(now); osc.stop(now + 1);
            }
        }

        function setEngineSpeed(speed) {
            if(!audioCtx) return;
            const now = audioCtx.currentTime;
            oscDrone.frequency.linearRampToValueAtTime(50 + (speed * 60), now + 2);
            gainDrone.gain.linearRampToValueAtTime(0.05 + (speed * 0.15), now + 2);
        }

        /* --- LÓGICA DE VIAJE --- */
        function travelTo(index) {
            if(state.isMoving || (index === state.currentIdx && state.doorsOpen)) return;
            document.querySelectorAll('.nav-pill').forEach((btn, i) => {
                btn.classList.toggle('active', i === index); btn.disabled = true;
            });

            if(state.doorsOpen) {
                closeDoors();
                setTimeout(() => startJourney(index), 1500);
            } else {
                startJourney(index);
            }
        }

        function startJourney(index) {
            state.isMoving = true; state.canOpen = false; state.currentIdx = index;
            document.body.classList.add('moving');
            document.getElementById('door-button').className = 'status-locked';
            document.getElementById('led-msg').innerText = `>>> VIAJANDO A: ${destinations[index].led}`;
            document.getElementById('led-msg').style.color = "#ffaa00";
            playSound('chime'); setEngineSpeed(1);

            setTimeout(() => { setEngineSpeed(0); document.getElementById('led-msg').innerText = `>>> LLEGANDO...`; }, 3000);
            setTimeout(() => { arrive(index); }, 5000);
        }

        function arrive(index) {
            state.isMoving = false;
            document.body.classList.remove('moving');
            document.querySelectorAll('.nav-pill').forEach(b => b.disabled = false);
            const data = destinations[index];
            document.getElementById('led-msg').innerText = `*** ESTACIÓN: ${data.name} ***`;
            document.getElementById('led-msg').style.color = "#00ff9d";
            document.getElementById('holo-title').innerText = data.name;
            document.getElementById('holo-desc').innerText = data.desc;
            state.canOpen = true;
            document.getElementById('door-button').className = 'status-ready';
            playSound('chime');
        }

        /* --- SISTEMA DE PUERTAS Y PASAJEROS --- */
        function interactionDoors() {
            if(state.isMoving) return;
            if(state.doorsOpen) closeDoors();
            else if(state.canOpen) openDoors();
        }

        function openDoors() {
            playSound('door');
            state.doorsOpen = true;
            document.getElementById('door-mechanism').classList.add('doors-open');
            document.getElementById('door-button').className = 'status-locked';
            setTimeout(() => {
                document.getElementById('holo-interface').classList.add('holo-active');
                managePassengers(); // INTELIGENCIA DE PASAJEROS
            }, 600);
        }

        function closeDoors() {
            playSound('door');
            state.doorsOpen = false;
            document.getElementById('holo-interface').classList.remove('holo-active');
            document.getElementById('door-mechanism').classList.remove('doors-open');
            setTimeout(() => {
                if(!state.isMoving && state.canOpen) document.getElementById('door-button').className = 'status-ready';
            }, 1000);
        }

        /* --- LÓGICA DE NPCs (PASAJEROS) --- */
        function managePassengers() {
            // Probabilidad del 80% de que ocurra algo
            if(Math.random() > 0.2) {
                // Decidir si entra alguien o sale alguien
                const emptySeats = occupiedSeats.map((val, idx) => val === false ? idx : null).filter(val => val !== null);
                const fullSeats = occupiedSeats.map((val, idx) => val === true ? idx : null).filter(val => val !== null);

                // Si hay sitios libres, 60% prob de entrar. Si no, intenta salir.
                if(emptySeats.length > 0 && Math.random() > 0.4) {
                    spawnIncomingPassenger(emptySeats[Math.floor(Math.random() * emptySeats.length)]);
                } else if (fullSeats.length > 0) {
                    spawnOutgoingPassenger(fullSeats[Math.floor(Math.random() * fullSeats.length)]);
                }
            }
        }

        function spawnIncomingPassenger(seatIndex) {
            const passenger = document.createElement('div');
            passenger.className = 'npc-walker';
            
            // Posición inicial (en la puerta, a la izquierda de la pantalla)
            // Calculamos coordenadas relativas a la passenger-area
            passenger.style.left = '-150px'; 
            passenger.style.bottom = '10px';
            passenger.style.opacity = '1';

            document.querySelector('.passenger-area').appendChild(passenger);

            // Calcular destino (posición del asiento)
            const targetSeat = document.getElementById(`seat-${seatIndex}`);
            const seatRect = targetSeat.getBoundingClientRect();
            const containerRect = document.querySelector('.passenger-area').getBoundingClientRect();
            
            // Offset visual
            const finalLeft = (seatRect.left - containerRect.left) + 10; 

            // 1. Caminar hacia el asiento
            setTimeout(() => {
                passenger.style.transform = `translateX(${finalLeft + 150}px)`;
            }, 100);

            // 2. Sentarse
            setTimeout(() => {
                passenger.classList.add('npc-seated');
                occupiedSeats[seatIndex] = true;
                passenger.id = `npc-in-seat-${seatIndex}`; // Guardar ID para poder sacarlo luego
            }, 3000); // Tarda 3s en llegar
        }

        function spawnOutgoingPassenger(seatIndex) {
            const passenger = document.getElementById(`npc-in-seat-${seatIndex}`);
            if(!passenger) return;

            // 1. Levantarse
            passenger.classList.remove('npc-seated');
            occupiedSeats[seatIndex] = false;
            passenger.id = ''; // Limpiar ID

            // 2. Caminar hacia la puerta (izquierda)
            setTimeout(() => {
                passenger.style.transform = `translateX(0px)`; // Volver a origen relativo (-150px visualmente fuera)
                passenger.style.opacity = '0';
            }, 500);

            // 3. Limpiar DOM
            setTimeout(() => {
                passenger.remove();
            }, 3500);
        }

        function interactionValidate() {
            // ... (Código validador igual) ...
             const led = document.querySelector('.val-status');
            const screen = document.querySelector('.val-screen');
            led.style.background = '#00ff9d'; led.style.boxShadow = '0 0 15px #00ff9d';
            screen.innerHTML = '<span style="color:#00ff9d; font-size:14px;">OK</span>';
            setTimeout(() => { led.style.background = '#333'; led.style.boxShadow = 'none'; screen.innerHTML = '<span style="font-size:10px; color:#f00;">NFC</span>'; }, 500);
        }
    </script>
</body>
</html>
